<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFD600">

<!-- iOS PWA fullscreen -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="5S Annotator">
<link rel="apple-touch-icon" href="icon-192.png">

<title>5S Annotator</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@500;700&display=swap');

:root {
  --y: #FFD600;
  --blk: #111;
  --red: #E53935;
  --grn: #2E7D32;
  --blu: #1565C0;
  --wht: #F5F5F0;
  --panel: #1c1c1c;
  --border: #333;
  --tap-size: 56px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  background: #0d0d0d;
  color: var(--wht);
  font-family: 'IBM Plex Mono', monospace;
  overflow: hidden;
}

/* ── TOP BAR ── */
#topbar {
  position: fixed; top: 0; left: 0; right: 0;
  height: 52px;
  background: var(--y);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 12px;
  z-index: 20;
  border-bottom: 3px solid var(--blk);
}

#topbar h1 {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.5rem;
  letter-spacing: 2px;
  color: var(--blk);
}

#topbar .top-btns { display: flex; gap: 8px; }

.top-btn {
  height: 36px; min-width: 36px;
  border: 2px solid var(--blk);
  background: var(--blk); color: var(--y);
  border-radius: 4px;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.68rem; font-weight: 700;
  padding: 0 10px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  gap: 4px;
  letter-spacing: 1px;
  -webkit-appearance: none;
}

.top-btn.yellow { background: var(--y); color: var(--blk); }
.top-btn.danger { background: var(--red); color: #fff; border-color: var(--red); }

/* ── CANVAS AREA ── */
#canvasWrap {
  position: fixed;
  top: 52px; bottom: 130px; left: 0; right: 0;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  background: #111;
  z-index: 1;
}

#canvasContainer {
  position: relative;
  display: none;
}

#baseImg {
  display: block;
  max-width: 100%;
  max-height: 100%;
  pointer-events: none;
  user-select: none;
}

#annotCanvas {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  touch-action: manipulation;
}

/* Tap point indicator */
.tap-dot {
  position: absolute;
  width: 20px; height: 20px;
  border-radius: 50%;
  background: var(--y);
  border: 3px solid #fff;
  transform: translate(-50%, -50%);
  pointer-events: none;
  z-index: 50;
  box-shadow: 0 0 0 3px rgba(0,0,0,0.5);
  animation: pulse 0.6s ease-out;
}

@keyframes pulse {
  0% { transform: translate(-50%,-50%) scale(2); opacity: 0.5; }
  100% { transform: translate(-50%,-50%) scale(1); opacity: 1; }
}

/* Upload screen */
#uploadScreen {
  position: fixed;
  top: 52px; bottom: 130px; left: 0; right: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 20px;
  background: #111;
  z-index: 5;
}

#uploadScreen .big-icon {
  font-size: 4rem;
}

#uploadScreen p {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.8rem;
  letter-spacing: 3px;
  color: #444;
}

#uploadScreen .sub {
  font-size: 0.72rem;
  color: #555;
  letter-spacing: 1px;
  font-family: 'IBM Plex Mono', monospace;
}

.upload-btn-big {
  background: var(--y);
  color: var(--blk);
  border: none;
  border-radius: 6px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.2rem;
  letter-spacing: 2px;
  padding: 14px 32px;
  cursor: pointer;
  -webkit-appearance: none;
}

/* ── STATUS BAR ── */
#statusBar {
  position: fixed;
  bottom: 130px; left: 0; right: 0;
  height: 34px;
  background: #1a1a1a;
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 14px;
  gap: 10px;
  font-size: 0.7rem;
  color: #888;
  letter-spacing: 1px;
  z-index: 10;
}

#statusBar .status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--y);
  flex-shrink: 0;
}

#statusBar .status-dot.waiting { background: #555; }
#statusBar .status-dot.point1 { background: var(--y); animation: blink 1s infinite; }
#statusBar .status-dot.ready { background: #4CAF50; }

@keyframes blink {
  0%,100% { opacity: 1; } 50% { opacity: 0.3; }
}

/* ── BOTTOM TOOLBAR ── */
#bottomBar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  height: 130px;
  background: var(--panel);
  border-top: 2px solid var(--border);
  display: flex; flex-direction: column;
  z-index: 10;
}

/* Tool row */
#toolRow {
  display: flex;
  height: 64px;
  border-bottom: 1px solid var(--border);
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
#toolRow::-webkit-scrollbar { display: none; }

.tool-tab {
  flex-shrink: 0;
  min-width: 72px;
  height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 4px;
  cursor: pointer;
  border-right: 1px solid var(--border);
  background: transparent;
  border-top: none; border-bottom: none; border-left: none;
  color: #888;
  padding: 0 8px;
  transition: background 0.1s;
  -webkit-appearance: none;
}

.tool-tab.active {
  background: var(--y);
  color: var(--blk);
}

.tool-tab .t-icon { font-size: 1.3rem; line-height: 1; }
.tool-tab .t-label { font-size: 0.58rem; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; }

/* Options row */
#optionRow {
  display: flex;
  height: 66px;
  align-items: center;
  padding: 0 10px;
  gap: 8px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
#optionRow::-webkit-scrollbar { display: none; }

/* Color swatches */
.swatch {
  width: 36px; height: 36px;
  border-radius: 6px;
  flex-shrink: 0;
  cursor: pointer;
  border: 3px solid transparent;
  position: relative;
  overflow: hidden;
  -webkit-appearance: none;
  transition: transform 0.1s;
}
.swatch.sel { border-color: #fff; transform: scale(1.15); }
.swatch input[type=color] {
  position: absolute; inset: 0;
  opacity: 0; cursor: pointer;
  width: 100%; height: 100%;
}

/* Width selector */
.width-btn {
  flex-shrink: 0;
  height: 36px; min-width: 44px;
  border-radius: 6px;
  border: 2px solid var(--border);
  background: #2a2a2a;
  color: var(--wht);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.7rem;
  font-weight: 700;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-appearance: none;
  transition: background 0.1s;
}
.width-btn.sel { background: var(--y); color: var(--blk); border-color: var(--y); }

/* Text input for labels */
#labelInput {
  flex: 1;
  min-width: 120px;
  height: 36px;
  background: #2a2a2a;
  border: 1px solid #444;
  border-radius: 6px;
  color: #fff;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.75rem;
  padding: 0 10px;
  -webkit-appearance: none;
}

/* Divider */
.opt-divider {
  width: 1px; height: 36px;
  background: var(--border);
  flex-shrink: 0;
}

/* Stripe size label */
.opt-label {
  font-size: 0.6rem;
  color: #666;
  white-space: nowrap;
  letter-spacing: 1px;
}

/* ── CONFIRM OVERLAY ── */
#confirmLine {
  position: fixed;
  top: 52px; left: 0; right: 0;
  background: rgba(0,0,0,0.85);
  display: none;
  align-items: center; justify-content: center;
  gap: 12px;
  padding: 10px 16px;
  z-index: 200;
  border-bottom: 2px solid var(--y);
}

#confirmLine span {
  font-size: 0.75rem; color: var(--wht); letter-spacing: 1px; flex: 1;
}

.confirm-btn {
  height: 36px; padding: 0 14px;
  border-radius: 4px; border: none;
  font-family: 'IBM Plex Mono', monospace;
  font-size: 0.72rem; font-weight: 700;
  cursor: pointer; -webkit-appearance: none;
}
.confirm-btn.ok { background: var(--y); color: var(--blk); }
.confirm-btn.cancel { background: #333; color: #fff; }

</style>
</head>
<body>

<!-- TOP BAR -->
<div id="topbar">
  <h1>5S ANNOTATOR</h1>
  <div class="top-btns">
    <button class="top-btn" id="undoBtn">↩ UNDO</button>
    <button class="top-btn danger" id="clearBtn">✕</button>
    <button class="top-btn yellow" id="saveBtn">⬇ SAVE</button>
    <label class="top-btn" style="cursor:pointer">
      📁
      <input type="file" id="fileInput" accept="image/*,image/heic,image/heif,.heic,.heif" style="display:none">
    </label>
  </div>
</div>

<!-- UPLOAD SCREEN -->
<div id="uploadScreen">
  <div class="big-icon">📷</div>
  <p>LOAD A PHOTO</p>
  <div class="sub">TAP TO SELECT FROM CAMERA ROLL</div>
  <label class="upload-btn-big">
    LOAD PHOTO
    <input type="file" id="fileInput2" accept="image/*,image/heic,image/heif,.heic,.heif" style="display:none">
  </label>
</div>

<!-- CANVAS -->
<div id="canvasWrap">
  <div id="canvasContainer">
    <img id="baseImg" src="" alt="">
    <canvas id="annotCanvas"></canvas>
  </div>
</div>

<!-- CONFIRM OVERLAY (shown between tap 1 and tap 2) -->
<div id="confirmLine" id="confirmLine">
  <span id="confirmMsg">TAP A SECOND POINT TO COMPLETE THE LINE</span>
  <button class="confirm-btn cancel" id="cancelPoint">CANCEL</button>
</div>

<!-- STATUS BAR -->
<div id="statusBar">
  <div class="status-dot waiting" id="statusDot"></div>
  <span id="statusText">LOAD A PHOTO TO BEGIN</span>
  <button id="armBtn" style="
    display:none;
    margin-left:auto; flex-shrink:0;
    height:28px; padding:0 14px;
    background:#FFD600; color:#111; border:none; border-radius:4px;
    font-family:'IBM Plex Mono',monospace; font-size:0.7rem; font-weight:700;
    letter-spacing:1px; cursor:pointer; -webkit-appearance:none;
  ">▶ START</button>
</div>

<!-- BOTTOM BAR -->
<div id="bottomBar">
  <!-- Tool tabs -->
  <div id="toolRow">
    <button class="tool-tab active" data-tool="hazard">
      <span class="t-icon">⚠️</span>
      <span class="t-label">Hazard</span>
    </button>
    <button class="tool-tab" data-tool="line">
      <span class="t-icon">━</span>
      <span class="t-label">Line</span>
    </button>
    <button class="tool-tab" data-tool="rect">
      <span class="t-icon">▭</span>
      <span class="t-label">Zone</span>
    </button>
    <button class="tool-tab" data-tool="arrow">
      <span class="t-icon">↗</span>
      <span class="t-label">Arrow</span>
    </button>
    <button class="tool-tab" data-tool="label">
      <span class="t-icon">🏷</span>
      <span class="t-label">Label</span>
    </button>
    <button class="tool-tab" data-tool="callout">
      <span class="t-icon">💬</span>
      <span class="t-label">Callout</span>
    </button>
  </div>

  <!-- Options row (changes per tool) -->
  <div id="optionRow"></div>
</div>

<script>
// ── STATE ──
let tool = 'hazard';
let color1 = '#FFD600', color2 = '#111111', solidColor = '#FFD600';
let lineWidth = 24, stripeWidth = 14;
let opacity = 0.92;
let labelText = '';
let annotations = [];
let tapState = 0; // 0=idle, 1=waiting for second tap
let pt1 = null;
let tapDotEl = null;
let armed = false; // must press START to enable tapping photo

const canvas = document.getElementById('annotCanvas');
const ctx = canvas.getContext('2d');
const baseImg = document.getElementById('baseImg');
const canvasContainer = document.getElementById('canvasContainer');
const uploadScreen = document.getElementById('uploadScreen');
const statusDot = document.getElementById('statusDot');
const statusText = document.getElementById('statusText');
const confirmLine = document.getElementById('confirmLine');
const confirmMsg = document.getElementById('confirmMsg');

// ── IMAGE LOAD ──
// Handles JPEG, PNG, GIF, WebP, HEIC, HEIF, AVIF, BMP, TIFF
// On iOS Safari, HEIC/HEIF are decoded natively by the browser via createObjectURL.
// If that fails (e.g. older iOS or non-Safari), we fall back to drawing into a
// temporary canvas and exporting as PNG, which always works.
function loadFile(file) {
  if (!file) return;

  setStatus('waiting', 'LOADING IMAGE…');

  const isHEIC = /heic|heif/i.test(file.type) || /\.heic$|\.heif$/i.test(file.name);

  // Try native load first (works on iOS 11+ Safari for HEIC)
  const url = URL.createObjectURL(file);
  const testImg = new Image();

  testImg.onload = () => {
    // Native decode worked
    applyImage(testImg.src, testImg.naturalWidth, testImg.naturalHeight);
    URL.revokeObjectURL(url);
  };

  testImg.onerror = () => {
    // Native decode failed — use FileReader + canvas to convert
    URL.revokeObjectURL(url);
    setStatus('waiting', 'CONVERTING FORMAT…');
    const reader = new FileReader();
    reader.onload = evt => {
      const fallbackImg = new Image();
      fallbackImg.onload = () => {
        // Draw to offscreen canvas and export as PNG
        const tmp = document.createElement('canvas');
        tmp.width = fallbackImg.naturalWidth;
        tmp.height = fallbackImg.naturalHeight;
        tmp.getContext('2d').drawImage(fallbackImg, 0, 0);
        applyImage(tmp.toDataURL('image/png'), tmp.width, tmp.height);
      };
      fallbackImg.onerror = () => {
        setStatus('waiting', 'ERROR: COULD NOT LOAD IMAGE. TRY SAVING AS JPG FIRST.');
      };
      fallbackImg.src = evt.target.result;
    };
    reader.readAsDataURL(file);
  };

  testImg.src = url;
}

function applyImage(src, w, h) {
  baseImg.onload = () => {
    uploadScreen.style.display = 'none';
    canvasContainer.style.display = 'inline-block';
    annotations = [];
    tapState = 0; pt1 = null;
    armed = false;
    removeTapDot();
    resizeCanvas();
    redraw();
    armBtn.style.display = 'block';
    armBtn.textContent = '▶ START';
    armBtn.style.background = '#FFD600';
    armBtn.style.color = '#111';
    setStatus('waiting', 'PRESS START TO ANNOTATE');
  };
  baseImg.src = src;
}

document.getElementById('fileInput').addEventListener('change', e => loadFile(e.target.files[0]));
document.getElementById('fileInput2').addEventListener('change', e => loadFile(e.target.files[0]));

function resizeCanvas() {
  const wrap = document.getElementById('canvasWrap');
  const ww = wrap.clientWidth, wh = wrap.clientHeight;
  const nat = baseImg.naturalWidth / baseImg.naturalHeight;
  let dw = ww, dh = ww / nat;
  if (dh > wh) { dh = wh; dw = wh * nat; }
  baseImg.style.width = dw + 'px';
  baseImg.style.height = dh + 'px';
  canvas.width = dw;
  canvas.height = dh;
  canvas.style.width = dw + 'px';
  canvas.style.height = dh + 'px';
}

window.addEventListener('resize', () => {
  if (baseImg.src && baseImg.complete && baseImg.naturalWidth) {
    resizeCanvas(); redraw();
  }
});

// ── STATUS ──
function setStatus(state, msg) {
  statusDot.className = 'status-dot ' + state;
  statusText.textContent = msg;
}

// ── ARM BUTTON ──
const armBtn = document.getElementById('armBtn');
armBtn.addEventListener('click', () => {
  if (!baseImg.src || baseImg.src === window.location.href) return;
  if (armed) {
    disarm();
  } else {
    armed = true;
    tapState = 0; pt1 = null;
    removeTapDot();
    confirmLine.style.display = 'none';
    armBtn.textContent = '■ STOP';
    armBtn.style.background = '#E53935';
    armBtn.style.color = '#fff';
    setStatus('point1', 'TAP FIRST POINT ON PHOTO');
  }
});

function disarm() {
  armed = false;
  tapState = 0; pt1 = null;
  removeTapDot();
  confirmLine.style.display = 'none';
  armBtn.textContent = '▶ START';
  armBtn.style.background = '#FFD600';
  armBtn.style.color = '#111';
  setStatus('waiting', 'PRESS START TO ANNOTATE');
}

// ── TAP HANDLING ──
canvas.addEventListener('touchstart', handleTap, { passive: false });
canvas.addEventListener('click', handleTap);

function getTapPos(e) {
  const r = canvas.getBoundingClientRect();
  if (e.touches) {
    return {
      x: e.touches[0].clientX - r.left,
      y: e.touches[0].clientY - r.top
    };
  }
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

function handleTap(e) {
  e.preventDefault();
  if (!armed) return; // ← photo does nothing unless armed
  if (!baseImg.src || baseImg.src === window.location.href) return;

  const pos = getTapPos(e);

  if (tool === 'label' || tool === 'callout') {
    const text = labelText || (tool === 'label' ? 'LABEL' : 'ISSUE HERE');
    annotations.push({ tool, x1: pos.x, y1: pos.y, text, color: solidColor, opacity });
    redraw();
    disarm();
    setStatus('waiting', '✓ PLACED — PRESS START TO ADD MORE');
    return;
  }

  if (tapState === 0) {
    pt1 = pos;
    tapState = 1;
    showTapDot(pos.x, pos.y);
    confirmLine.style.display = 'flex';
    confirmMsg.textContent = 'POINT 1 SET — TAP SECOND POINT';
    setStatus('point1', 'TAP SECOND POINT ON PHOTO');
  } else if (tapState === 1) {
    const pt2 = pos;
    tapState = 0;
    removeTapDot();
    confirmLine.style.display = 'none';
    annotations.push({
      tool,
      x1: pt1.x, y1: pt1.y,
      x2: pt2.x, y2: pt2.y,
      color: solidColor, opacity,
      lineWidth, stripeWidth, color1, color2
    });
    pt1 = null;
    redraw();
    disarm();
    setStatus('waiting', '✓ DRAWN — PRESS START TO ADD MORE');
  }
}

document.getElementById('cancelPoint').addEventListener('click', () => {
  disarm();
  setStatus('waiting', 'CANCELLED — PRESS START TO TRY AGAIN');
});

function showTapDot(x, y) {
  removeTapDot();
  const dot = document.createElement('div');
  dot.className = 'tap-dot';
  dot.style.left = x + 'px';
  dot.style.top = y + 'px';
  canvasContainer.appendChild(dot);
  tapDotEl = dot;
}

function removeTapDot() {
  if (tapDotEl) { tapDotEl.remove(); tapDotEl = null; }
}

// ── DRAWING ──
function redraw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  annotations.forEach(a => drawAnnotation(ctx, a, canvas.width, canvas.height));
}

function drawAnnotation(c, ann, cw, ch) {
  c.save();
  c.globalAlpha = ann.opacity;

  if (ann.tool === 'hazard') {
    drawHazardLine(c, ann.x1, ann.y1, ann.x2, ann.y2, ann.lineWidth, ann.stripeWidth, ann.color1, ann.color2);
  } else if (ann.tool === 'line') {
    c.strokeStyle = ann.color;
    c.lineWidth = ann.lineWidth;
    c.lineCap = 'round';
    c.beginPath(); c.moveTo(ann.x1, ann.y1); c.lineTo(ann.x2, ann.y2); c.stroke();
  } else if (ann.tool === 'rect') {
    const x = Math.min(ann.x1, ann.x2), y = Math.min(ann.y1, ann.y2);
    const w = Math.abs(ann.x2 - ann.x1), h = Math.abs(ann.y2 - ann.y1);
    c.strokeStyle = ann.color; c.lineWidth = Math.max(3, ann.lineWidth / 5);
    c.strokeRect(x, y, w, h);
    c.globalAlpha = ann.opacity * 0.18;
    c.fillStyle = ann.color; c.fillRect(x, y, w, h);
  } else if (ann.tool === 'arrow') {
    drawArrow(c, ann.x1, ann.y1, ann.x2, ann.y2, ann.lineWidth, ann.color);
  } else if (ann.tool === 'label') {
    drawLabel(c, ann.x1, ann.y1, ann.text, ann.color, cw);
  } else if (ann.tool === 'callout') {
    drawCallout(c, ann.x1, ann.y1, ann.text, ann.color, cw);
  }

  c.restore();
}

function makeStripePattern(c, c1, c2, sw) {
  const off = document.createElement('canvas');
  off.width = sw * 2; off.height = sw * 2;
  const oc = off.getContext('2d');
  oc.fillStyle = c1; oc.fillRect(0, 0, sw*2, sw*2);
  oc.fillStyle = c2;
  [[0,0,sw,0,0,sw],[sw*2,0,sw*2,sw,sw,0],[0,sw,sw,sw*2,0,sw*2],[sw*2,sw,sw*2,sw*2,sw,sw*2]].forEach(([ax,ay,bx,by,cx,cy]) => {
    oc.beginPath(); oc.moveTo(ax,ay); oc.lineTo(bx,by); oc.lineTo(cx,cy); oc.closePath(); oc.fill();
  });
  return c.createPattern(off, 'repeat');
}

function drawHazardLine(c, x1, y1, x2, y2, lw, sw, c1, c2) {
  const dx = x2-x1, dy = y2-y1, len = Math.sqrt(dx*dx+dy*dy);
  if (len < 2) return;
  const nx = -dy/len, ny = dx/len, hw = lw/2;
  const corners = [
    {x: x1+nx*hw, y: y1+ny*hw}, {x: x2+nx*hw, y: y2+ny*hw},
    {x: x2-nx*hw, y: y2-ny*hw}, {x: x1-nx*hw, y: y1-ny*hw}
  ];
  c.save();
  c.beginPath();
  c.moveTo(corners[0].x, corners[0].y);
  corners.forEach((p,i) => { if(i>0) c.lineTo(p.x,p.y); });
  c.closePath(); c.clip();
  const pat = makeStripePattern(c, c1, c2, sw);
  c.fillStyle = pat;
  const xs = corners.map(p=>p.x), ys = corners.map(p=>p.y);
  c.fillRect(Math.min(...xs)-sw*2, Math.min(...ys)-sw*2,
             Math.max(...xs)-Math.min(...xs)+sw*4, Math.max(...ys)-Math.min(...ys)+sw*4);
  c.restore();
  c.save();
  c.strokeStyle = 'rgba(0,0,0,0.35)'; c.lineWidth = 1.5;
  c.beginPath(); c.moveTo(corners[0].x, corners[0].y);
  corners.forEach((p,i) => { if(i>0) c.lineTo(p.x,p.y); });
  c.closePath(); c.stroke(); c.restore();
}

function drawArrow(c, x1, y1, x2, y2, lw, color) {
  const hl = Math.max(18, lw * 1.4);
  const dx = x2-x1, dy = y2-y1, angle = Math.atan2(dy,dx);
  const sw = Math.max(3, lw/5);
  c.strokeStyle = color; c.fillStyle = color;
  c.lineWidth = sw; c.lineCap = 'round';
  c.beginPath(); c.moveTo(x1,y1);
  c.lineTo(x2 - Math.cos(angle)*hl*0.7, y2 - Math.sin(angle)*hl*0.7);
  c.stroke();
  c.beginPath(); c.moveTo(x2,y2);
  c.lineTo(x2 - hl*Math.cos(angle-0.4), y2 - hl*Math.sin(angle-0.4));
  c.lineTo(x2 - hl*Math.cos(angle+0.4), y2 - hl*Math.sin(angle+0.4));
  c.closePath(); c.fill();
}

function contrast(hex) {
  if (!hex || hex.length < 7) return '#111';
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return (0.299*r + 0.587*g + 0.114*b) > 140 ? '#111' : '#fff';
}

function drawLabel(c, x, y, text, color, cw) {
  const fs = Math.round(canvas.width / 28);
  c.font = `bold ${fs}px IBM Plex Mono, monospace`;
  const m = c.measureText(text), pad = fs*0.6;
  const bw = m.width + pad*2, bh = fs*2;
  const lx = Math.min(x - bw/2, cw - bw - 4);
  c.fillStyle = color;
  roundRect(c, Math.max(4,lx), y - bh/2, bw, bh, 4); c.fill();
  c.fillStyle = contrast(color);
  c.fillText(text, Math.max(4,lx)+pad, y + fs*0.38);
}

function drawCallout(c, x, y, text, color, cw) {
  const fs = Math.round(canvas.width / 28);
  c.font = `bold ${fs}px IBM Plex Mono, monospace`;
  const m = c.measureText(text), pad = fs*0.7;
  const bw = m.width + pad*2, bh = fs*2.4, tail = fs*0.9;
  const lx = Math.min(x - bw/2, cw - bw - 4);
  c.fillStyle = color;
  roundRect(c, Math.max(4,lx), y - bh - tail, bw, bh, 5); c.fill();
  c.beginPath();
  c.moveTo(x - fs*0.6, y - tail);
  c.lineTo(x, y);
  c.lineTo(x + fs*0.6, y - tail);
  c.closePath(); c.fill();
  c.fillStyle = contrast(color);
  c.fillText(text, Math.max(4,lx)+pad, y - tail - bh/2 + fs*0.38);
}

function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r); c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h); c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r); c.quadraticCurveTo(x,y,x+r,y); c.closePath();
}

// ── TOOL TABS ──
document.querySelectorAll('.tool-tab').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.tool-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    tool = btn.dataset.tool;
    disarm();
    buildOptions();
    if (baseImg.src && baseImg.src !== window.location.href) {
      setStatus('waiting', 'PRESS START TO ANNOTATE');
    }
  });
});

// ── OPTIONS BUILDER ──
function buildOptions() {
  const row = document.getElementById('optionRow');
  row.innerHTML = '';

  if (tool === 'hazard') {
    row.appendChild(makeLabel('C1'));
    makeColorSwatches(['#FFD600','#ffffff','#D32F2F','#2E7D32'], color1, c => { color1 = c; }, '1').forEach(el => row.appendChild(el));
    row.appendChild(makeDivider());
    row.appendChild(makeLabel('C2'));
    makeColorSwatches(['#111111','#ffffff','#D32F2F','#1565C0'], color2, c => { color2 = c; }, '2').forEach(el => row.appendChild(el));
    row.appendChild(makeDivider());
    row.appendChild(makeLabel('W'));
    [16,24,36,48].forEach(w => {
      const btn = document.createElement('button');
      btn.className = 'width-btn' + (w === lineWidth ? ' sel' : '');
      btn.textContent = w;
      btn.addEventListener('click', () => {
        lineWidth = w;
        document.querySelectorAll('.width-btn').forEach(b => b.classList.remove('sel'));
        btn.classList.add('sel');
      });
      row.appendChild(btn);
    });
  } else if (tool === 'line' || tool === 'rect' || tool === 'arrow') {
    row.appendChild(makeLabel('COLOR'));
    makeColorSwatches(['#FFD600','#D32F2F','#ffffff','#2E7D32','#1565C0'], solidColor, c => { solidColor = c; }, 'solid').forEach(el => row.appendChild(el));
    row.appendChild(makeDivider());
    row.appendChild(makeLabel('W'));
    [8,16,24,36].forEach(w => {
      const btn = document.createElement('button');
      btn.className = 'width-btn' + (w === lineWidth ? ' sel' : '');
      btn.textContent = w;
      btn.addEventListener('click', () => {
        lineWidth = w;
        document.querySelectorAll('.width-btn').forEach(b => b.classList.remove('sel'));
        btn.classList.add('sel');
      });
      row.appendChild(btn);
    });
  } else if (tool === 'label' || tool === 'callout') {
    const input = document.createElement('input');
    input.type = 'text';
    input.id = 'labelInput';
    input.className = '';
    input.style.cssText = 'flex:1;min-width:130px;height:36px;background:#2a2a2a;border:1px solid #444;border-radius:6px;color:#fff;font-family:IBM Plex Mono,monospace;font-size:0.75rem;padding:0 10px;-webkit-appearance:none;';
    input.placeholder = tool === 'label' ? 'Label text...' : 'Issue description...';
    input.value = labelText;
    input.addEventListener('input', () => { labelText = input.value; });
    row.appendChild(input);
    row.appendChild(makeDivider());
    row.appendChild(makeLabel('COLOR'));
    makeColorSwatches(['#FFD600','#D32F2F','#ffffff','#1565C0','#2E7D32'], solidColor, c => { solidColor = c; }, 'solid').forEach(el => row.appendChild(el));
  }
}

function makeLabel(txt) {
  const s = document.createElement('span');
  s.className = 'opt-label';
  s.textContent = txt;
  return s;
}

function makeDivider() {
  const d = document.createElement('div');
  d.className = 'opt-divider';
  return d;
}

function makeColorSwatches(colors, selected, onSelect, slot) {
  const els = [];
  colors.forEach(col => {
    const sw = document.createElement('button');
    sw.className = 'swatch' + (col === selected ? ' sel' : '');
    sw.style.background = col;
    sw.dataset.color = col;
    sw.addEventListener('click', () => {
      onSelect(col);
      document.querySelectorAll(`.swatch[data-slot="${slot}"]`).forEach(s => s.classList.remove('sel'));
      sw.classList.add('sel');
    });
    sw.dataset.slot = slot;
    els.push(sw);
  });

  // Custom color picker
  const custom = document.createElement('button');
  custom.className = 'swatch';
  custom.style.background = 'conic-gradient(red,orange,yellow,green,blue,purple,red)';
  custom.dataset.slot = slot;
  const inp = document.createElement('input');
  inp.type = 'color'; inp.value = selected;
  inp.addEventListener('input', e => {
    onSelect(e.target.value);
    document.querySelectorAll(`.swatch[data-slot="${slot}"]`).forEach(s => s.classList.remove('sel'));
    custom.classList.add('sel');
  });
  custom.appendChild(inp);
  els.push(custom);

  return els;
}

// ── UNDO / CLEAR / SAVE ──
document.getElementById('undoBtn').addEventListener('click', () => {
  annotations.pop(); redraw();
  setStatus('waiting', 'UNDONE — TAP FIRST POINT TO START');
});

document.getElementById('clearBtn').addEventListener('click', () => {
  if (!annotations.length || confirm('Clear all annotations?')) {
    annotations = []; tapState = 0; pt1 = null;
    removeTapDot(); confirmLine.style.display = 'none';
    redraw(); setStatus('waiting', 'CLEARED — TAP FIRST POINT TO START');
  }
});

document.getElementById('saveBtn').addEventListener('click', () => {
  if (!baseImg.src || baseImg.src === window.location.href) { alert('Load a photo first.'); return; }

  const out = document.createElement('canvas');
  out.width = baseImg.naturalWidth; out.height = baseImg.naturalHeight;
  const oc = out.getContext('2d');
  oc.drawImage(baseImg, 0, 0, out.width, out.height);

  const sx = out.width / canvas.width, sy = out.height / canvas.height;

  annotations.forEach(ann => {
    const sc = Object.assign({}, ann, {
      x1: ann.x1*sx, y1: ann.y1*sy,
      x2: ann.x2 != null ? ann.x2*sx : undefined,
      y2: ann.y2 != null ? ann.y2*sy : undefined,
      lineWidth: ann.lineWidth * sx,
      stripeWidth: ann.stripeWidth ? ann.stripeWidth*sx : undefined
    });
    oc.save(); oc.globalAlpha = sc.opacity;
    if (sc.tool==='hazard') drawHazardLine(oc,sc.x1,sc.y1,sc.x2,sc.y2,sc.lineWidth,sc.stripeWidth,sc.color1,sc.color2);
    else if (sc.tool==='line') { oc.strokeStyle=sc.color; oc.lineWidth=sc.lineWidth; oc.lineCap='round'; oc.beginPath(); oc.moveTo(sc.x1,sc.y1); oc.lineTo(sc.x2,sc.y2); oc.stroke(); }
    else if (sc.tool==='rect') {
      const x=Math.min(sc.x1,sc.x2),y=Math.min(sc.y1,sc.y2),w=Math.abs(sc.x2-sc.x1),h=Math.abs(sc.y2-sc.y1);
      oc.strokeStyle=sc.color; oc.lineWidth=Math.max(3,sc.lineWidth/5); oc.strokeRect(x,y,w,h);
      oc.globalAlpha=sc.opacity*0.18; oc.fillStyle=sc.color; oc.fillRect(x,y,w,h);
    }
    else if (sc.tool==='arrow') drawArrow(oc,sc.x1,sc.y1,sc.x2,sc.y2,sc.lineWidth,sc.color);
    else if (sc.tool==='label') drawLabel(oc,sc.x1,sc.y1,sc.text,sc.color,out.width);
    else if (sc.tool==='callout') drawCallout(oc,sc.x1,sc.y1,sc.text,sc.color,out.width);
    oc.restore();
  });

  out.toBlob(async blob => {
    const file = new File([blob], '5S-annotated.png', { type: 'image/png' });

    // iOS: use Web Share API → saves directly to Photos app
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({ files: [file], title: '5S Annotated Photo' });
        return;
      } catch(err) {
        if (err.name === 'AbortError') return; // user cancelled share sheet
      }
    }

    // Fallback: download link (goes to Files app)
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '5S-annotated.png';
    a.click();
  }, 'image/png');
});

// ── INIT ──
buildOptions();

// ── SERVICE WORKER ──
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
